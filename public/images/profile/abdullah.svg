<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="limeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="#334155" stroke-width="4" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#limeRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Subtle glow -->
  <circle cx="200" cy="180" r="80" fill="#84cc16" opacity="0.15" filter="url(#avatarGlow)" />

  <!-- Minimalist Geometric Developer Icon / Monogram -->
  <g transform="translate(140, 110)">
    <!-- Code Bracket Left -->
    <path d="M-15 40 L-40 70 L-15 100" fill="none" stroke="#a3e635" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Code Bracket Right -->
    <path d="M135 40 L160 70 L135 100" fill="none" stroke="#a3e635" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Stylized Letter 'A' Monogram -->
  <text x="200" y="225" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" text-anchor="middle" letter-spacing="-2">
    A
  </text>

  <!-- Subtitle Badge in Avatar -->
  <g transform="translate(200, 290)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="-65" cy="0" r="4" fill="#a3e635" />
    <text x="-50" y="4" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
      ABDULLAH • DEV
    </text>
  </g>
</svg>
