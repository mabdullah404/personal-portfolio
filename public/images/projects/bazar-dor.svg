<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="#84cc16" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="480" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- App Window Frame -->
  <g transform="translate(100, 60)">
    <!-- Browser Mockup Window -->
    <rect width="1000" height="555" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top bar -->
    <rect width="1000" height="48" rx="16" fill="#131c2e" />
    <rect y="36" width="1000" height="12" fill="#131c2e" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <!-- Address bar mockup -->
    <rect x="260" y="10" width="480" height="28" rx="6" fill="#090d16" stroke="#1e293b" />
    <text x="500" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
      bazar-dor-project-omega.vercel.app
    </text>

    <!-- App Header Inside -->
    <g transform="translate(40, 75)">
      <text x="0" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">
        Bazar <tspan fill="#a3e635">Dor</tspan>
      </text>
      <text x="0" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
        Daily Market Commodity &amp; Grocery Price Tracker
      </text>

      <!-- Search mockup -->
      <g transform="translate(560, 10)">
        <rect width="360" height="42" rx="8" fill="#131d31" stroke="#334155" />
        <circle cx="24" cy="21" r="7" stroke="#94a3b8" stroke-width="2" fill="none" />
        <line x1="29" y1="26" x2="36" y2="33" stroke="#94a3b8" stroke-width="2" />
        <text x="46" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Search vegetables, fish, groceries...</text>
      </g>
    </g>

    <!-- Category filter pills -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="70" height="30" rx="15" fill="#a3e635" />
      <text x="35" y="19" fill="#090d16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">All Items</text>

      <rect x="80" y="0" width="100" height="30" rx="15" fill="#172554" stroke="#1e3a8a" />
      <text x="130" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Vegetables</text>

      <rect x="190" y="0" width="70" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="225" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Fish &amp; Meat</text>

      <rect x="270" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="310" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Groceries</text>

      <rect x="360" y="0" width="70" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="395" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Spices</text>
    </g>

    <!-- Commodity Cards Grid -->
    <g transform="translate(40, 215)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="285" height="155" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <text x="20" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Fresh Potatoes</text>
        <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Local Red Variety (per kg)</text>
        <text x="20" y="112" fill="#a3e635" font-family="system-ui, sans-serif" font-size="28" font-weight="800">৳ 45 <tspan font-size="14" fill="#94a3b8">/ kg</tspan></text>
        <rect x="200" y="22" width="65" height="22" rx="4" fill="#064e3b" />
        <text x="232" y="37" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Stable</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(315, 0)">
        <rect width="285" height="155" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
        <text x="20" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Imported Onions</text>
        <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Grade A Indian (per kg)</text>
        <text x="20" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">৳ 95 <tspan font-size="14" fill="#94a3b8">/ kg</tspan></text>
        <rect x="200" y="22" width="65" height="22" rx="4" fill="#450a0a" />
        <text x="232" y="37" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">▲ +৳5</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(630, 0)">
        <rect width="290" height="155" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
        <text x="20" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Miniket Rice</text>
        <text x="20" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Premium Polished (per kg)</text>
        <text x="20" y="112" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="28" font-weight="800">৳ 72 <tspan font-size="14" fill="#94a3b8">/ kg</tspan></text>
        <rect x="205" y="22" width="65" height="22" rx="4" fill="#064e3b" />
        <text x="237" y="37" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Stable</text>
      </g>
    </g>

    <!-- Status footer inside mockup -->
    <g transform="translate(40, 405)">
      <rect width="920" height="60" rx="8" fill="#131d31" stroke="#1e293b" />
      <circle cx="25" cy="30" r="4" fill="#a3e635" />
      <text x="40" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
        Updated in real-time with responsive mobile layout and fast query filters.
      </text>
      <rect x="800" y="16" width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="850" y="34" fill="#a3e635" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Live on Vercel</text>
    </g>
  </g>
</svg>
