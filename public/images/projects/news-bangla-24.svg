<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glowN" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#newsBg)" />
  <circle cx="150" cy="150" r="180" fill="#ef4444" opacity="0.12" filter="url(#glowN)" />
  <circle cx="1020" cy="480" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glowN)" />

  <!-- App Window -->
  <g transform="translate(100, 60)">
    <rect width="1000" height="555" rx="16" fill="#0c1017" stroke="#27272a" stroke-width="1.5" />

    <!-- Window top bar -->
    <rect width="1000" height="48" rx="16" fill="#18181b" />
    <rect y="36" width="1000" height="12" fill="#18181b" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <rect x="270" y="10" width="460" height="28" rx="6" fill="#090a0f" stroke="#27272a" />
    <text x="500" y="28" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
      news-bangla-24-o8cr.vercel.app
    </text>

    <!-- News App Header -->
    <g transform="translate(40, 70)">
      <!-- Logo & Date -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="18" fill="#d11111" />
        <text x="20" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">২৪</text>
        
        <text x="50" y="26" fill="#ef4444" font-family="system-ui, sans-serif" font-size="22" font-weight="900">
          Bangla News <tspan fill="#fafafa">24</tspan>
        </text>

        <!-- Right action buttons -->
        <g transform="translate(740, 5)">
          <rect width="70" height="30" rx="6" fill="#18181b" stroke="#3f3f46" />
          <text x="35" y="19" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sign In</text>

          <rect x="85" y="0" width="80" height="30" rx="6" fill="#d11111" />
          <text x="125" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sign Up</text>
        </g>
      </g>

      <!-- Category Navigation bar -->
      <g transform="translate(0, 55)">
        <rect width="920" height="36" rx="8" fill="#18181b" />
        <text x="30" y="23" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">হোম</text>
        <text x="95" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">রাজনীতি</text>
        <text x="175" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">বিশ্ব</text>
        <text x="235" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">অর্থনীতি</text>
        <text x="315" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">স্বাস্থ্য</text>
        <text x="385" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">খেলা</text>
        <text x="445" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">প্রযুক্তি</text>
        <text x="525" y="23" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">ভিডিও</text>
      </g>

      <!-- Breaking News Marquee Bar -->
      <g transform="translate(0, 105)">
        <rect width="920" height="32" rx="6" fill="#991b1b" />
        <rect width="90" height="32" rx="6" fill="#7f1d1d" />
        <text x="45" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">সর্বশেষ</text>
        <text x="105" y="21" fill="#fef2f2" font-family="system-ui, sans-serif" font-size="12">
          স্পেনে দুটি দ্রুতগামী ট্রেনের সংঘর্ষ • বঙ্গোপসাগরে সৃষ্ট অতি তীব্র ঘূর্ণিঝড় &#39;অর্ণব&#39; • নির্বাচনের তাজা খবর...
        </text>
      </g>

      <!-- News Articles Grid Preview -->
      <g transform="translate(0, 150)">
        <!-- Featured Main Article -->
        <g transform="translate(0, 0)">
          <rect width="560" height="235" rx="12" fill="#18181b" stroke="#27272a" />
          <rect width="560" height="130" rx="12" fill="#27272a" />
          <text x="280" y="70" fill="#71717a" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">[Lead News Headline Image Preview]</text>
          
          <rect x="20" y="145" width="80" height="20" rx="4" fill="#450a0a" />
          <text x="60" y="159" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">প্রধান খবর</text>
          
          <text x="20" y="190" fill="#fafafa" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
            স্পেনে দুটি দ্রুতগামী ট্রেনের সংঘর্ষে অন্তত ৩০ জন নিহত
          </text>
          <text x="20" y="212" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">
            মাদ্রিদের কাছে দুটি ট্রেনের মধ্যে সংঘর্ষে বিপুল হতাহত... বিস্তারিত লাইভ কভারেজ
          </text>
        </g>

        <!-- Right Side News List -->
        <g transform="translate(580, 0)">
          <rect width="340" height="72" rx="10" fill="#18181b" stroke="#27272a" />
          <text x="15" y="28" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">জাতীয়</text>
          <text x="15" y="50" fill="#fafafa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ঘূর্ণিঝড় &#39;অর্ণব&#39; এর প্রভাবে উপকূলীয় জনজীবন</text>

          <rect y="82" width="340" height="72" rx="10" fill="#18181b" stroke="#27272a" />
          <text x="15" y="110" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">আন্তর্জাতিক</text>
          <text x="15" y="132" fill="#fafafa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">মাঝ সাগরে আটকা বিলাসবহুল জাহাজ</text>

          <rect y="164" width="340" height="72" rx="10" fill="#18181b" stroke="#27272a" />
          <text x="15" y="192" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">রাজনীতি</text>
          <text x="15" y="214" fill="#fafafa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">নির্বাচনী জোট ও ভোটের নতুন সমীকরণ</text>
        </g>
      </g>
    </g>
  </g>
</svg>
