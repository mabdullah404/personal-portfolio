<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="matchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131e" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="matchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#matchBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="180" fill="#06b6d4" opacity="0.14" filter="url(#matchGlow)" />
  <circle cx="1020" cy="460" r="220" fill="#3b82f6" opacity="0.12" filter="url(#matchGlow)" />
  <circle cx="600" cy="520" r="170" fill="#10b981" opacity="0.08" filter="url(#matchGlow)" />

  <!-- Browser Window Mockup -->
  <g transform="translate(100, 50)">
    <rect width="1000" height="575" rx="16" fill="#07111e" stroke="#1e293b" stroke-width="1.5" />

    <!-- Window Chrome -->
    <rect width="1000" height="46" rx="16" fill="#0c1829" />
    <rect y="34" width="1000" height="12" fill="#0c1829" />
    <circle cx="28" cy="23" r="6" fill="#ef4444" />
    <circle cx="48" cy="23" r="6" fill="#f59e0b" />
    <circle cx="68" cy="23" r="6" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="250" y="9" width="500" height="28" rx="7" fill="#050e18" stroke="#1e2d42" />
    <text x="500" y="27" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">
      football-prediction-platform-neon.vercel.app
    </text>

    <!-- App Header Inside -->
    <g transform="translate(40, 64)">
      <!-- Logo -->
      <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#cyanGrad)" />
      <circle cx="18" cy="18" r="9" stroke="#ffffff" stroke-width="2" fill="none" />
      <polygon points="18,13 22,16 20,21 16,21 14,16" fill="#ffffff" />
      <text x="48" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">
        Match<tspan fill="#38bdf8">IQ</tspan>
      </text>

      <rect x="156" y="8" width="96" height="20" rx="6" fill="#082f49" stroke="#0284c7" />
      <text x="204" y="22" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MATCH ANALYTICS</text>

      <!-- Nav Links -->
      <text x="560" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Fixtures Hub</text>
      <text x="680" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Poisson Engine</text>
      <text x="815" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Player Intelligence</text>

      <!-- Match Center Badge -->
      <rect x="870" y="4" width="95" height="28" rx="8" fill="url(#badgeGrad)" />
      <text x="917" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚽ Match Center</text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="116" x2="960" y2="116" stroke="#162235" stroke-width="1" />

    <!-- Main Match Banner Card -->
    <g transform="translate(40, 134)">
      <rect width="920" height="110" rx="14" fill="#0d1b2e" stroke="#1e2e48" stroke-width="1" />
      
      <!-- League & Status -->
      <text x="24" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PREMIER LEAGUE • MATCHWEEK 28</text>
      <rect x="230" y="16" width="55" height="16" rx="4" fill="#065f46" />
      <text x="257" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LIVE 68&apos;</text>

      <!-- Teams Row -->
      <g transform="translate(24, 45)">
        <!-- Team 1 -->
        <circle cx="20" cy="22" r="18" fill="#dc2626" />
        <text x="20" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">ARS</text>
        <text x="50" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Arsenal</text>

        <!-- Score -->
        <rect x="360" y="6" width="85" height="32" rx="8" fill="#07111e" stroke="#1e2e48" />
        <text x="402" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">2 - 1</text>

        <!-- Team 2 -->
        <circle cx="560" cy="22" r="18" fill="#0284c7" />
        <text x="560" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">MCI</text>
        <text x="590" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Manchester City</text>
      </g>

      <!-- Poisson Probabilities Row -->
      <g transform="translate(24, 88)">
        <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">POISSON WIN %:</text>
        <text x="100" y="12" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ARS 48.2%</text>
        <text x="190" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Draw 26.5%</text>
        <text x="280" y="12" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">MCI 25.3%</text>

        <text x="500" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">xG METRICS:</text>
        <text x="580" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">ARS 2.14 — 1.38 MCI</text>

        <text x="735" y="12" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mathematical Model Active</text>
      </g>
    </g>

    <!-- Two Columns: Left Pitch & Right Tactical Report -->
    <g transform="translate(40, 260)">
      <!-- Left: Pitch Visual (width 445) -->
      <g transform="translate(0, 0)">
        <rect width="445" height="235" rx="14" fill="url(#pitchGrad)" stroke="#065f46" stroke-width="1.5" />
        
        <!-- Pitch Markings -->
        <rect x="20" y="15" width="405" height="205" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
        <line x1="222" y1="15" x2="222" y2="220" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
        <circle cx="222" cy="117" r="35" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
        <circle cx="222" cy="117" r="2.5" fill="#10b981" />
        
        <!-- Penalty Boxes -->
        <rect x="20" y="65" width="60" height="105" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
        <rect x="365" y="65" width="60" height="105" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />

        <!-- Formation Title -->
        <rect x="30" y="24" width="120" height="20" rx="5" fill="#022c22" opacity="0.8" />
        <text x="90" y="38" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Official Lineup (4-3-3)</text>

        <!-- Player Nodes -->
        <circle cx="50" cy="117" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <text x="50" y="138" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Raya</text>

        <circle cx="100" cy="50" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="95" cy="95" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="95" cy="140" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="100" cy="185" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />

        <circle cx="150" cy="80" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="145" cy="117" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="150" cy="155" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />

        <circle cx="195" cy="60" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="190" cy="117" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="195" cy="175" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <text x="195" y="195" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Saka (8.4★)</text>

        <!-- Away Team Player Nodes (City) -->
        <circle cx="395" cy="117" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="345" cy="50" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="350" cy="95" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="350" cy="140" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="345" cy="185" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />

        <circle cx="295" cy="80" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="300" cy="117" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="295" cy="155" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />

        <circle cx="250" cy="60" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="255" cy="117" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
        <text x="255" y="137" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Haaland (1G)</text>
        <circle cx="250" cy="175" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Right: Tactical Intelligence Report Box (width 455) -->
      <g transform="translate(465, 0)">
        <rect width="455" height="235" rx="14" fill="#0c1728" stroke="#1e2f47" stroke-width="1.2" />

        <!-- Header -->
        <rect width="455" height="42" rx="14" fill="#13233c" />
        <rect y="30" width="455" height="12" fill="#13233c" />
        <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📊 TACTICAL MATCH INTELLIGENCE</text>
        <rect x="350" y="8" width="90" height="24" rx="6" fill="#1e2e48" />
        <text x="395" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Refresh Stats ↻</text>

        <!-- Tactical Report Content -->
        <g transform="translate(16, 56)">
          <text x="0" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Pressing &amp; Attacking Shape:</text>
          <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
            Arsenal is exploiting City&apos;s right-half space with high-intensity
          </text>
          <text x="0" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
            overloads. Saka&apos;s 1v1 duel win rate (78%) is forcing defensive fouls.
          </text>

          <rect x="0" y="68" width="422" height="1" fill="#1e2e48" />

          <text x="0" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Poisson Expected Scoreline: 2 - 1 (14.2% top probability)</text>
          <text x="0" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
            Over 2.5 Goals: 82% Probability | BTTS: Yes (Confirmed)
          </text>

          <!-- Key Player Matchup pill -->
          <rect x="0" y="122" width="422" height="42" rx="8" fill="#081322" stroke="#1b2a40" />
          <text x="12" y="140" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">KEY MATCHUP: Saka vs Gvardiol</text>
          <text x="12" y="155" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Expected duels: 9 | 1 yellow card risk detected</text>
        </g>
      </g>
    </g>
  </g>
</svg>
