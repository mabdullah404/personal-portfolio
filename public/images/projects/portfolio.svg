<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="50%" stop-color="#14171f" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="limeHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#portBg)" />

  <circle cx="200" cy="150" r="220" fill="#84cc16" opacity="0.14" filter="url(#glowP)" />
  <circle cx="950" cy="500" r="260" fill="#38bdf8" opacity="0.08" filter="url(#glowP)" />

  <!-- Code window frame -->
  <g transform="translate(100, 60)">
    <rect width="1000" height="555" rx="16" fill="#0f1117" stroke="#262b36" stroke-width="1.5" />

    <!-- Top window -->
    <rect width="1000" height="48" rx="16" fill="#181c25" />
    <rect y="36" width="1000" height="12" fill="#181c25" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <rect x="300" y="10" width="400" height="28" rx="6" fill="#0d0f14" stroke="#262b36" />
    <text x="500" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
      portfolio.abdullah.dev (Next.js 16 + TypeScript)
    </text>

    <!-- Interior Hero Preview -->
    <g transform="translate(60, 90)">
      <!-- Badge -->
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <circle cx="16" cy="14" r="4" fill="#a3e635" />
      <text x="32" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
        FULL STACK DEVELOPER
      </text>

      <!-- Main Headline -->
      <text x="0" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
        Abdullah
      </text>
      <text x="0" y="125" fill="#a3e635" font-family="system-ui, sans-serif" font-size="24" font-weight="600">
        Learning &amp; Building Modern Web Applications
      </text>

      <text x="0" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">
        Computer Science &amp; Engineering student at BUBT crafting clean, high-performance interfaces.
      </text>

      <!-- Button Mockups -->
      <g transform="translate(0, 205)">
        <rect width="160" height="44" rx="8" fill="url(#limeHero)" />
        <text x="80" y="27" fill="#0a0c10" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
          Explore Projects →
        </text>

        <rect x="180" y="0" width="160" height="44" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="260" y="27" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
          Download Resume ⇣
        </text>
      </g>

      <!-- Tech Stack Pills -->
      <g transform="translate(0, 280)">
        <text x="0" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
          TECH ARSENAL
        </text>
        <g transform="translate(0, 30)">
          <rect x="0" y="0" width="80" height="28" rx="6" fill="#181c25" stroke="#262b36" />
          <text x="40" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Next.js</text>

          <rect x="90" y="0" width="95" height="28" rx="6" fill="#181c25" stroke="#262b36" />
          <text x="137" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">TypeScript</text>

          <rect x="195" y="0" width="70" height="28" rx="6" fill="#181c25" stroke="#262b36" />
          <text x="230" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">React</text>

          <rect x="275" y="0" width="105" height="28" rx="6" fill="#181c25" stroke="#262b36" />
          <text x="327" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Tailwind CSS</text>
        </g>
      </g>
    </g>

    <!-- Right Side Architecture Graphic -->
    <g transform="translate(600, 100)">
      <rect width="330" height="340" rx="14" fill="#121620" stroke="#262b36" />
      <rect x="20" y="20" width="290" height="40" rx="8" fill="#1a202c" stroke="#334155" />
      <text x="35" y="45" fill="#a3e635" font-family="monospace" font-size="13">src/app/page.tsx</text>

      <rect x="20" y="75" width="290" height="40" rx="8" fill="#1a202c" stroke="#334155" />
      <text x="35" y="100" fill="#38bdf8" font-family="monospace" font-size="13">src/app/projects/[slug]</text>

      <rect x="20" y="130" width="290" height="40" rx="8" fill="#1a202c" stroke="#334155" />
      <text x="35" y="155" fill="#fcd34d" font-family="monospace" font-size="13">src/data/projects.ts</text>

      <rect x="20" y="185" width="290" height="40" rx="8" fill="#1a202c" stroke="#334155" />
      <text x="35" y="210" fill="#c084fc" font-family="monospace" font-size="13">src/types/index.ts</text>

      <rect x="20" y="245" width="290" height="70" rx="8" fill="#0d1117" stroke="#84cc16" stroke-width="1.5" />
      <circle cx="40" cy="275" r="5" fill="#a3e635" />
      <text x="55" y="272" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dynamic Routes Active</text>
      <text x="55" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero broken links • Type Safe</text>
    </g>
  </g>
</svg>
